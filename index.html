<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Chess App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#121316;--card:#1c1e23;--accent:#4ade80;--text:#e8e8ea;--muted:#8b8d94;--light:#eeeed2;--dark:#769656;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding-bottom:80px;}
header{padding:14px 16px;font-size:20px;font-weight:700;}
header span{color:var(--accent);}
.tab{display:none;padding:0 12px;}
.tab.active{display:block;}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0;}
.muted{color:var(--muted);}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(94vw,480px);height:min(94vw,480px);margin:8px auto;border-radius:8px;overflow:hidden;}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(9vw,44px);line-height:1;user-select:none;min-width:0;min-height:0;position:relative;}
.light{background:var(--light);}
.dark{background:var(--dark);}
.last::after{content:"";position:absolute;inset:0;background:rgba(255,220,0,.35);}
.sel::after{content:"";position:absolute;inset:0;background:rgba(80,160,255,.5);}
.dot::before{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.25);z-index:3;}
.piece{position:relative;z-index:2;}
#status{text-align:center;font-weight:600;margin:6px 0;}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
button{background:#2a2d34;color:var(--text);border:0;border-radius:10px;padding:11px 16px;font-size:15px;}
button.primary{background:var(--accent);color:#06210f;font-weight:700;}
#moves{font-family:monospace;line-height:1.7;}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#17181c;border-top:1px solid #2a2d34;}
nav button{flex:1;background:none;border-radius:0;padding:12px 0 14px;color:var(--muted);font-size:12px;}
nav button .ic{display:block;font-size:20px;margin-bottom:2px;}
nav button.active{color:var(--accent);}
.swatch{display:inline-block;width:64px;height:64px;border-radius:10px;overflow:hidden;margin:6px;border:3px solid transparent;}
.swatch.on{border-color:var(--accent);}
.swatch div{width:100%;height:50%;}
</style>
</head>
<body>
<header>♞ My <span>Chess</span> App</header>

<div id="play" class="tab active">
  <div id="board"></div>
  <div id="status"></div>
  <div class="row">
    <button onclick="undo()">Undo</button>
    <button onclick="flipBoard()">Flip</button>
    <button class="primary" onclick="newGame()">New game</button>
  </div>
  <div class="card"><b>Moves</b><div id="moves" class="muted">No moves yet</div></div>
</div>

<div id="analyze" class="tab">
  <div class="card"><b>Analyze</b><p class="muted">Coming soon: Stockfish analysis of your games.</p></div>
</div>
<div id="stats" class="tab">
  <div class="card"><b>Stats</b><p class="muted">Coming soon: openings you lose with, and where you lose.</p></div>
</div>
<div id="train" class="tab">
  <div class="card"><b>Blunder training</b><p class="muted">Coming soon: replay your own blunders.</p></div>
</div>
<div id="settings" class="tab">
  <div class="card"><b>Board theme</b><div id="themes"></div></div>
</div>

<nav>
  <button class="active" onclick="showTab('play',this)"><span class="ic">♟</span>Play</button>
  <button onclick="showTab('analyze',this)"><span class="ic">📊</span>Analyze</button>
  <button onclick="showTab('stats',this)"><span class="ic">📈</span>Stats</button>
  <button onclick="showTab('train',this)"><span class="ic">🎯</span>Train</button>
  <button onclick="showTab('settings',this)"><span class="ic">⚙️</span>Settings</button>
</nav>

<script src="app.js"></script>
</body>
</html>
